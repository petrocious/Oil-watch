apiVersion: apps/v1
kind: Deployment
metadata:
    name: backend
    namespace: oil-price-app
spec:
    replicas: 1
    selector:
        matchLabels:
            app: backend
    template:
        metadata:
            labels:
                app: backend
        spec:
            containers:
              - name: backend
                image: jenkins:5000/oilwatch-backend:v15 # Please replace with the actual image address you built
                ports:
                  - containerPort: 8000
                env:
                  - name: DATABASE_URL
                    value: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)"
                envFrom:
                  - secretRef:
                      name: db-secrets
                # Health check to ensure rolling updates do not route traffic to unavailable pods
                readinessProbe:
                  httpGet:
                    path: /health
                    port: 8000
                  initialDelaySeconds: 5
                  periodSeconds: 10
                livenessProbe:
                  httpGet:
                    path: /health
                    port: 8000
                  initialDelaySeconds: 15
                  periodSeconds: 20
                resources:
                  requests:
                    cpu: "100m"
                    memory: "128Mi"

---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: oil-price-app
spec:
  selector:
    app: backend
  ports:
  - port: 8000
    targetPort: 8000